# Grok Build Desktop — electron-builder config (unsigned release builds).
# Entry: out/desktop/main.js (see package.json scripts dist / dist:mac / dist:win).
# Does not affect the VS Code VSIX path (npm run package).

appId: com.productcompass.grok-build-desktop
productName: Grok Build Desktop
copyright: Copyright © Paweł Huryn

# Keep installers out of the extension tree; never ship this folder in the VSIX.
directories:
  output: dist-desktop
  buildResources: resources

# Packaged package.json main (extension still uses out/extension.js for VS Code).
extraMetadata:
  main: out/desktop/main.js
  name: grok-build-desktop
  # rcedit stamps `description` as the .exe FileDescription, which is the label
  # Windows shows in Task Manager and the UAC prompt. package.json's is the
  # marketplace blurb — a 300-character paragraph in a column meant for a name.
  description: Grok Build Desktop (Community)

# Layout inside app.asar (or app/ when --dir):
#   package.json, out/**, media/**, resources/**, LICENSE, node_modules/{ws,jpeg-js}
# resolveExtensionRoot() expects media/chat.js at the package root (see src/desktop/paths.ts).
files:
  - package.json
  - LICENSE
  - out/**/*
  - media/**/*
  - resources/**/*
  - node_modules/ws/**/*
  - node_modules/jpeg-js/**/*
  - "!out/**/*.map"
  - "!**/*.{ts,tsx,md}"

asar: true

# Predictable GitHub Release asset names for the download page:
#   Grok-Build-Desktop-<version>-mac-arm64.dmg
#   Grok-Build-Desktop-<version>-mac-x64.dmg
#   Grok-Build-Desktop-<version>-win-x64.exe
# ${os} is electron-builder's short name: mac | win | linux
artifactName: Grok-Build-Desktop-${version}-${os}-${arch}.${ext}

# No auto-update publish channel yet (see docs/desktop.md).
publish: null

# App icon. Round, with transparency outside the disc: the square version sat on
# an opaque white tile, which reads as a sticker on a dark Windows taskbar and
# does not match how macOS masks dock icons either. A plain transparent
# background was not an option — the mark itself is dark, so it would vanish in
# dark mode.
#
# NOT resources/grok-icon.png: that one is the VS Code marketplace listing icon
# and is deliberately left alone.
#
# Set PER PLATFORM, not once at the root. A root-level `icon` did not reach the
# packaged executable — 3.2.0 installed with Electron's atom on the Start menu
# entry and the taskbar, while the installer .exe (which NSIS resolves
# separately) correctly showed the Grok mark. `resources/icon.ico` doubles as
# the conventional buildResources name, so it is found even if a block is ever
# dropped. electron-builder requires >=256 for NSIS / macOS targets.

mac:
  icon: resources/grok-icon-round-512.png
  category: public.app-category.developer-tools
  # Unsigned — no Apple Developer certificate yet.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  # ${arch} matters: without it the arm64 and x64 builds both mount a volume
  # called "Grok Build Desktop <version>", and the second one races the first's
  # unmount — hdiutil detach then fails on a volume that is already gone or
  # still busy, which is what killed the first macOS run.
  title: Grok Build Desktop ${version} ${arch}

win:
  # An explicit multi-size .ico rather than relying on the PNG conversion, so
  # every Windows surface draws the same mark at every size.
  icon: resources/icon.ico
  # `signAndEditExecutable: false` used to sit here, reasoning "unsigned, so
  # nothing to sign". It does more than its first word says: it also skips the
  # EDIT step (rcedit), which is what stamps the icon and version metadata onto
  # the .exe. That is why 3.2.0 installed with Electron's atom on the Start menu
  # and the taskbar while the installer itself looked right — NSIS resolves its
  # own icons separately. It was never needed: with no certificate configured
  # electron-builder already logs "no signing info identified, signing is
  # skipped" and moves on.
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  # The wizard's own icons are resolved separately from `win.icon` and from each
  # other, so name all three: the installer .exe as Explorer draws it, the
  # uninstaller, and the small mark in the wizard header.
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Grok Build Desktop
  uninstallDisplayName: Grok Build Desktop (Community)
  artifactName: Grok-Build-Desktop-${version}-${os}-${arch}.${ext}

linux:
  icon: resources/grok-icon-round-512.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
